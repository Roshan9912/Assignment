[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-hardware-assistant"
version = "0.1.0"
description = "Local Linux hardware Q&A assistant with safe allow-listed commands"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Copilot" }]
license = { text = "MIT" }
keywords = ["linux", "hardware", "assistant", "cli"]

[project.scripts]
hardware-assistant = "hardware_assistant:main"

[tool.setuptools]
py-modules = ["hardware_assistant"]
